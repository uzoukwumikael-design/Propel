<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#060606"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1C1C1C" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8FF2E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (large, centered-left) -->
  <rect x="80" y="80" width="100" height="100" rx="22" fill="#B8FF2E"/>
  <rect x="106" y="98" width="14" height="66" rx="2" fill="#060606"/>
  <path d="M120 98h12a20 20 0 0 1 0 40h-12z" fill="#060606"/>

  <!-- Wordmark -->
  <text x="200" y="152"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="900" font-size="64" letter-spacing="-2" fill="#E8E8E8">Propel</text>

  <!-- Main headline -->
  <text x="80" y="300"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="900" font-size="72" letter-spacing="-3" fill="#E8E8E8">Stop guessing.</text>
  <text x="80" y="390"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="900" font-size="72" letter-spacing="-3" fill="#B8FF2E">Start launching.</text>

  <!-- Subtext -->
  <text x="80" y="470"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="400" font-size="28" fill="#505050">AI-powered marketing tools for founders</text>

  <!-- Feature pills -->
  <rect x="80" y="520" width="160" height="44" rx="22" fill="#1C1C1C"/>
  <text x="160" y="548" text-anchor="middle"
    font-family="system-ui,sans-serif" font-weight="600" font-size="16" fill="#E8E8E8">AI Copy</text>

  <rect x="256" y="520" width="200" height="44" rx="22" fill="#1C1C1C"/>
  <text x="356" y="548" text-anchor="middle"
    font-family="system-ui,sans-serif" font-weight="600" font-size="16" fill="#E8E8E8">Press Kits</text>

  <rect x="472" y="520" width="200" height="44" rx="22" fill="#1C1C1C"/>
  <text x="572" y="548" text-anchor="middle"
    font-family="system-ui,sans-serif" font-weight="600" font-size="16" fill="#E8E8E8">SEO Tools</text>

  <rect x="688" y="520" width="200" height="44" rx="22" fill="#B8FF2E"/>
  <text x="788" y="548" text-anchor="middle"
    font-family="system-ui,sans-serif" font-weight="700" font-size="16" fill="#060606">Free Plan ↗</text>

  <!-- Right side: mini dashboard mockup -->
  <rect x="820" y="80" width="320" height="460" rx="16" fill="#0D0D0D" stroke="#1C1C1C" stroke-width="1"/>
  <rect x="820" y="80" width="320" height="44" rx="16" fill="#080808"/>
  <rect x="820" y="107" width="320" height="17" fill="#080808"/>
  <circle cx="844" cy="102" r="6" fill="#FF5E57"/>
  <circle cx="864" cy="102" r="6" fill="#FEBC2E"/>
  <circle cx="884" cy="102" r="6" fill="#28C840"/>

  <rect x="840" y="146" width="280" height="40" rx="8" fill="#161616"/>
  <text x="856" y="172" font-family="system-ui,sans-serif" font-size="13" fill="#505050">AI Copy Engine — Tagline</text>

  <rect x="840" y="200" width="280" height="52" rx="8" fill="#0A0A0A" stroke="#B8FF2E" stroke-width="1" stroke-opacity="0.4"/>
  <text x="856" y="224" font-family="system-ui,sans-serif" font-size="13" fill="#E8E8E8">Security compliance that</text>
  <text x="856" y="244" font-family="system-ui,sans-serif" font-size="13" fill="#E8E8E8">doesn't slow you down.</text>
  <rect x="1066" y="208" width="40" height="22" rx="11" fill="#B8FF2E"/>
  <text x="1086" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="12" fill="#060606">9.4</text>

  <rect x="840" y="264" width="280" height="50" rx="8" fill="#111" stroke="#1C1C1C" stroke-width="1"/>
  <text x="856" y="294" font-family="system-ui,sans-serif" font-size="13" fill="#505050">From startup to enterprise-ready...</text>

  <rect x="840" y="326" width="280" height="50" rx="8" fill="#111" stroke="#1C1C1C" stroke-width="1"/>
  <text x="856" y="356" font-family="system-ui,sans-serif" font-size="13" fill="#505050">Close enterprise deals without...</text>

  <rect x="840" y="400" width="280" height="52" rx="10" fill="#B8FF2E"/>
  <text x="980" y="433" text-anchor="middle"
    font-family="system-ui,sans-serif" font-weight="800" font-size="16" fill="#060606">✦ Regenerate</text>
</svg>
